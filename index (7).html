// Affiche à l'écran les erreurs de chargement ou d'exécution (utile sur téléphone)
(function () {
  function show(msg) {
    var box = document.getElementById("diag") || document.createElement("pre");
    box.id = "diag";
    box.style.cssText = "white-space:pre-wrap;margin:16px;padding:12px;background:#fff3f0;color:#7a1f10;border:1px solid #e0b4a8;border-radius:8px;font:13px/1.4 monospace";
    box.textContent = (box.textContent ? box.textContent + "\n\n" : "Erreur : ") + msg;
    (document.body || document.documentElement).appendChild(box);
  }
  window.addEventListener("error", function (e) {
    if (e.target && e.target.src) show("Impossible de charger : " + e.target.src);
    else show((e.message || "erreur inconnue") + (e.lineno ? " (ligne " + e.lineno + ")" : ""));
  }, true);
  window.addEventListener("unhandledrejection", function (e) { show(String(e.reason && e.reason.message || e.reason)); });
  window.addEventListener("load", function () {
    var missing = ["React", "ReactDOM", "supabase", "Babel"].filter(function (n) { return !window[n]; });
    if (missing.length) show("Bibliothèques manquantes : " + missing.join(", "));
  });
})();
</script>

/* ==========================================================================
   2. ÉTAT GLOBAL (Context + Reducer)
   Boutique et administration partagent le même store : toute modification
   faite dans l'admin (stock, disponibilité, ajout, suppression) apparaît
   immédiatement côté boutique.
   ========================================================================== */

const StoreContext = createContext(null);
const useStore = () => useContext(StoreContext);

const initialState = { products: [], cart: [], orders: [] } // produits et commandes viennent de Supabase;

function reducer(state, action) {
  switch (action.type) {
    case "SET_PRODUCTS": // Catalogue reçu de la base
      return { ...state, products: action.products };
    case "SET_ORDERS": // Commandes reçues de la base (admin)
      return { ...state, orders: action.orders };
    case "DELETE_PRODUCT": // Supprime aussi le produit des paniers
      return { ...state, products: state.products.filter((p) => p.id !== action.id), cart: state.cart.filter((l) => l.id !== action.id) };
    case "TOGGLE_AVAILABLE":
      return { ...state, products: state.products.map((p) => (p.id === action.id ? { ...p, available: !p.available } : p)) };
    case "SET_STOCK": {
      const stock = Math.max(0, action.stock);
      return {
        ...state,
        products: state.products.map((p) => (p.id === action.id ? { ...p, stock } : p)),
        // Si le stock baisse sous la quantité d'un panier, on ajuste ce panier
        cart: state.cart.map((l) => (l.id === action.id ? { ...l, qty: Math.min(l.qty, stock) } : l)).filter((l) => l.qty > 0),
      };
    }
    case "CART_ADD": {
      const product = state.products.find((p) => p.id === action.id);
      const line = state.cart.find((l) => l.id === action.id);
      const qty = (line?.qty || 0) + 1;
      if (!product || qty > product.stock) return state; // jamais plus que le stock
      return { ...state, cart: line ? state.cart.map((l) => (l.id === action.id ? { ...l, qty } : l)) : [...state.cart, { id: action.id, qty }] };
    }
    case "CART_SET_QTY": {
      const product = state.products.find((p) => p.id === action.id);
      const qty = Math.min(action.qty, product?.stock ?? 0);
      return { ...state, cart: state.cart.map((l) => (l.id === action.id ? { ...l, qty } : l)).filter((l) => l.qty > 0) };
    }
    case "CART_REMOVE":
      return { ...state, cart: state.cart.filter((l) => l.id !== action.id) };
    case "PLACE_ORDER": {
      // Commande simulée : on décrémente le stock et on vide le panier
      const products = state.products.map((p) => {
        const line = state.cart.find((l) => l.id === p.id);
        return line ? { ...p, stock: Math.max(0, p.stock - line.qty) } : p;
      });
      return { ...state, products, cart: [], orders: [action.order, ...state.orders] };
    }
    default:
      return state;
  }
}

// Visuel produit : image si une URL est fournie, sinon pictogramme sur fond dégradé
function ProductVisual({ product, className = "" }) {
  const [broken, setBroken] = useState(false);
  const Icon = product.category === "Capsules" ? Package : product.category === "Accessoires" ? Wrench : Coffee;
  if (product.image && !broken) {
    return <img src={product.image} alt={product.name} onError={() => setBroken(true)} className={`object-cover ${className}`} />;
  }
  return (
    <div className={`flex items-center justify-center bg-gradient-to-br from-[#E6D5BC] to-[#C9A67C] ${className}`} aria-label={product.name}>
      <Icon size={44} strokeWidth={1.25} color={C.espresso} />
    </div>
  );
}

function ProductCard({ product }) {
  const { dispatch, state } = useStore();
  const inCart = state.cart.find((l) => l.id === product.id)?.qty || 0;
  const soldOut = product.stock === 0;
  const maxed = inCart >= product.stock;
  return (
    <article className="group flex flex-col overflow-hidden rounded-2xl bg-[#FBF7F0] ring-1 ring-[#3B2418]/10">
      <div className="relative">
        <ProductVisual product={product} className="h-52 w-full" />
        {soldOut && <span className="absolute left-3 top-3 rounded-full bg-[#2B2B2E] px-3 py-1 text-xs text-white">Rupture de stock</span>}
        {!soldOut && product.stock <= 5 && <span className="absolute left-3 top-3 rounded-full bg-[#B07A45] px-3 py-1 text-xs text-white">Plus que {product.stock}</span>}
      </div>
      <div className="flex flex-1 flex-col p-5">
        <p className="text-xs text-[#B07A45]">{product.category}</p>
        <h3 className="mt-1 font-serif text-lg text-[#3B2418]">{product.name}</h3>
        <p className="mt-2 flex-1 text-sm leading-relaxed text-[#2B2B2E]/70">{product.description}</p>
        <div className="mt-4 flex items-center justify-between">
          <span className="font-serif text-xl text-[#3B2418]">{fmt(product.price)}</span>
          <button
            disabled={soldOut || maxed}
            onClick={() => dispatch({ type: "CART_ADD", id: product.id })}
            className="flex items-center gap-2 rounded-full bg-[#3B2418] px-4 py-2 text-sm text-[#F5EEE3] transition hover:bg-[#2B2B2E] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#B07A45] disabled:cursor-not-allowed disabled:opacity-40"

          </button>
        </div>
      </div>
    </article>
  );
}

      <h1 className="font-serif text-4xl text-[#3B2418]">La boutique</h1>
      <div className="mt-8 flex flex-wrap gap-2">
        {["Tous", ...CATEGORIES].map((c) => (
          <button key={c} onClick={() => setCat(c)} aria-pressed={cat === c}
            className={`rounded-full px-4 py-2 text-sm transition ${cat === c ? "bg-[#3B2418] text-[#F5EEE3]" : "bg-[#FBF7F0] text-[#2B2B2E] ring-1 ring-[#3B2418]/15 hover:ring-[#B07A45]"}`}>
            {c}
          </button>
        ))}
      </div>
      {visible.length === 0 ? (
        <p className="mt-16 text-center text-[#2B2B2E]/60">Aucun produit disponible dans cette catégorie pour le moment.</p>
      ) : (
        <div className="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-4">{visible.map((p) => <ProductCard key={p.id} product={p} />)}</div>
      )}
    </section>
  );
}

/* ==========================================================================
   6. PANIER + CHECKOUT SIMULÉ
   ========================================================================== */

function Cart({ setPage }) {
  const { state, dispatch } = useStore();
  const lines = state.cart.map((l) => ({ ...l, product: state.products.find((p) => p.id === l.id) })).filter((l) => l.product);
  const subtotal = lines.reduce((s, l) => s + l.qty * l.product.price, 0);
  const shipping = subtotal === 0 || subtotal >= FREE_SHIPPING_FROM ? 0 : SHIPPING_FEE;

  if (lines.length === 0) {
    return (
      <section className="mx-auto max-w-xl px-5 py-24 text-center">
        <ShoppingBag size={40} strokeWidth={1.25} className="mx-auto" color={C.caramel} />
        <h1 className="mt-4 font-serif text-3xl text-[#3B2418]">Votre panier est vide</h1>
        <button onClick={() => setPage("shop")} className="mt-6 rounded-full bg-[#3B2418] px-6 py-3 text-sm text-[#F5EEE3]">Parcourir la boutique</button>
      </section>
    );
  }
  return (
    <section className="mx-auto grid max-w-6xl gap-10 px-5 py-14 lg:grid-cols-3">
      <div className="lg:col-span-2">
        <h1 className="font-serif text-3xl text-[#3B2418]">Votre panier</h1>
        <ul className="mt-6 divide-y divide-[#3B2418]/10">
          {lines.map(({ id, qty, product }) => (
            <li key={id} className="flex items-center gap-4 py-4">
              <ProductVisual product={product} className="h-20 w-20 rounded-xl" />
              <div className="flex-1">
                <p className="font-serif text-[#3B2418]">{product.name}</p>
                <p className="text-sm text-[#2B2B2E]/60">{fmt(product.price)}</p>
              </div>
              <div className="flex items-center gap-2 rounded-full ring-1 ring-[#3B2418]/20">
                <button aria-label="Retirer un" onClick={() => dispatch({ type: "CART_SET_QTY", id, qty: qty - 1 })} className="p-2"><Minus size={14} /></button>
                <span className="w-5 text-center text-sm">{qty}</span>
                <button aria-label="Ajouter un" disabled={qty >= product.stock} onClick={() => dispatch({ type: "CART_SET_QTY", id, qty: qty + 1 })} className="p-2 disabled:opacity-30"><Plus size={14} /></button>
              </div>
              <button aria-label="Supprimer" onClick={() => dispatch({ type: "CART_REMOVE", id })} className="p-2 text-[#2B2B2E]/50 hover:text-red-700"><Trash2 size={18} /></button>
            </li>
          ))}
        </ul>
      </div>
      <aside className="h-fit rounded-2xl bg-[#FBF7F0] p-6 ring-1 ring-[#3B2418]/10">
        <h2 className="font-serif text-xl text-[#3B2418]">Récapitulatif</h2>
        <dl className="mt-4 space-y-2 text-sm">
          <div className="flex justify-between"><dt>Sous-total</dt><dd>{fmt(subtotal)}</dd></div>
          <div className="flex justify-between"><dt>Livraison</dt><dd>{shipping === 0 ? "Offerte" : fmt(shipping)}</dd></div>
          <div className="flex justify-between border-t border-[#3B2418]/10 pt-3 font-serif text-lg text-[#3B2418]"><dt>Total</dt><dd>{fmt(subtotal + shipping)}</dd></div>
        </dl>
        <button onClick={() => setPage("checkout")} className="mt-6 w-full rounded-full bg-[#3B2418] py-3 text-sm text-[#F5EEE3] hover:bg-[#2B2B2E]">Passer la commande</button>
      </aside>
    </section>
  );
}

function Checkout({ setPage }) {
  const { state, dispatch } = useStore();
  const [form, setForm] = useState({ name: "", email: "", address: "", city: "", phone: "", pay: "À la livraison" });
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [done, setDone] = useState(null); // numéro de commande une fois validée
  const lines = state.cart.map((l) => ({ ...l, product: state.products.find((p) => p.id === l.id) })).filter((l) => l.product);
  const subtotal = lines.reduce((s, l) => s + l.qty * l.product.price, 0);
  const total = subtotal + (subtotal >= FREE_SHIPPING_FROM ? 0 : SHIPPING_FEE);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

  if (done) {
    return (
      <section className="mx-auto max-w-xl px-5 py-24 text-center">
        <div className="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-[#3B2418]"><Check color="#F5EEE3" /></div>
        <h1 className="mt-6 font-serif text-3xl text-[#3B2418]">Merci, votre commande est confirmée</h1>
        <p className="mt-3 text-[#2B2B2E]/70">Commande n° {done}. Nous vous contactons au numéro indiqué pour confirmer la livraison et le paiement.</p>
        <button onClick={() => setPage("shop")} className="mt-8 rounded-full bg-[#3B2418] px-6 py-3 text-sm text-[#F5EEE3]">Continuer mes achats</button>
      </section>
    );
  }
  if (lines.length === 0 && !busy) return <Cart setPage={setPage} />;

  const submit = async (e) => {
    e.preventDefault();
    setBusy(true);
    setError("");
    try {
      // Le stock est vérifié et décrémenté côté serveur ; le total est recalculé en base
      const id = await dispatch({ type: "PLACE_ORDER", customer: form, total });
      setDone(id);
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  };
  const field = "mt-1 w-full rounded-lg border border-[#3B2418]/20 bg-white px-3 py-2.5 text-sm focus:border-[#B07A45] focus:outline-none focus:ring-1 focus:ring-[#B07A45]";
  return (
    <section className="mx-auto max-w-3xl px-5 py-14">
      <button onClick={() => setPage("cart")} className="mb-6 flex items-center gap-1 text-sm text-[#B07A45]"><ArrowLeft size={14} /> Retour au panier</button>
      <h1 className="font-serif text-3xl text-[#3B2418]">Finaliser la commande</h1>
      <form onSubmit={submit} className="mt-8 space-y-5">
        <label className="block text-sm">Nom complet<input required className={field} value={form.name} onChange={set("name")} /></label>
        <label className="block text-sm">E-mail<input required type="email" className={field} value={form.email} onChange={set("email")} /></label>
        <label className="block text-sm">Adresse<input required className={field} value={form.address} onChange={set("address")} /></label>
        <label className="block text-sm">Ville<input required className={field} value={form.city} onChange={set("city")} /></label>
        <label className="block text-sm">Téléphone (Orange Money, MTN, Wave)<input required type="tel" className={field} value={form.phone} onChange={set("phone")} /></label>
        <label className="block text-sm">Mode de paiement
          <select className={field} value={form.pay} onChange={set("pay")}>
            <option>À la livraison</option>
            <option>Mobile Money (confirmation par téléphone)</option>
          </select>
        </label>
        {error && <p role="alert" className="text-sm text-red-700">{error}</p>}
        <button disabled={busy} className="w-full rounded-full bg-[#B07A45] py-3 text-sm text-white hover:bg-[#C48B55] disabled:opacity-50">{busy ? "Validation…" : `Confirmer la commande, ${fmt(total)}`}</button>
      </form>
    </section>
  );
}

function AdminLogin() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const submit = async (e) => {
    e.preventDefault();
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) setError("E-mail ou mot de passe incorrect.");
  };
  const field = "w-full rounded-lg border border-[#3B2418]/20 bg-white px-3 py-2.5 text-sm focus:border-[#B07A45] focus:outline-none";
  return (
    <section className="mx-auto max-w-sm px-5 py-24">
      <Lock size={32} strokeWidth={1.25} color={C.caramel} />
      <h1 className="mt-4 font-serif text-3xl text-[#3B2418]">Espace administration</h1>
      <form onSubmit={submit} className="mt-6 space-y-3">
        <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="E-mail" className={field} />
        <input type="password" required value={password} onChange={(e) => { setPassword(e.target.value); setError(""); }} placeholder="Mot de passe" className={field} />
        {error && <p className="text-sm text-red-700">{error}</p>}
        <button className="w-full rounded-full bg-[#3B2418] py-3 text-sm text-[#F5EEE3]">Se connecter</button>
      </form>
    </section>
  );
}

// Formulaire d'ajout d'un produit
function ProductForm({ onClose }) {
  const { dispatch } = useStore();

  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const submit = (e) => {
    e.preventDefault();
    dispatch({ type: "ADD_PRODUCT", product: { ...f, price: parseFloat(f.price), stock: parseInt(f.stock, 10) || 0, available: true, featured: false } });
    onClose();
  };
  const field = "mt-1 w-full rounded-lg border border-[#3B2418]/20 bg-white px-3 py-2 text-sm focus:border-[#B07A45] focus:outline-none";
  return (
    <form onSubmit={submit} className="mb-8 grid gap-4 rounded-2xl bg-[#FBF7F0] p-6 ring-1 ring-[#3B2418]/10 sm:grid-cols-2">
      <div className="flex items-center justify-between sm:col-span-2">
        <h2 className="font-serif text-xl text-[#3B2418]">Nouveau produit</h2>
        <button type="button" onClick={onClose} aria-label="Fermer"><X size={18} /></button>

/* ==========================================================================
   8. APPLICATION (routage simple par état)
   ========================================================================== */

function App() {
  const [state, dispatch] = useReducer(reducer, initialState);
  const [page, setPage] = useState("home");
  const [shopCat, setShopCat] = useState("Tous"); // secteur présélectionné dans la boutique

  // Charge le catalogue depuis la base
  const load = useCallback(async () => {
    try { dispatch({ type: "SET_PRODUCTS", products: await db.products() }); } catch (e) { console.error(e); }
  }, []);

  // Temps réel : tout changement en base (admin, commande d'un client) met la boutique à jour
  useEffect(() => {
    load();
    const channel = supabase.channel("products-live").on("postgres_changes", { event: "*", schema: "public", table: "products" }, load).subscribe();
    return () => { supabase.removeChannel(channel); };
  }, [load]);

  // Toute action de l'admin ou du checkout est écrite en base, puis répercutée à l'écran.
  // Le panier reste local (navigateur).
  const act = useCallback(async (a) => {
    try {
      switch (a.type) {
        case "ADD_PRODUCT": await db.addProduct(a.product); return load();
        case "DELETE_PRODUCT": dispatch(a); return await db.deleteProduct(a.id);
        case "TOGGLE_AVAILABLE": {
          dispatch(a);
          const p = state.products.find((x) => x.id === a.id);
          return await db.updateProduct(a.id, { available: !p.available });
        }
        case "SET_STOCK": dispatch(a); return await db.updateProduct(a.id, { stock: Math.max(0, a.stock) });
        case "PLACE_ORDER": {
          const id = await db.placeOrder(a.customer, state.cart);
          dispatch({ type: "PLACE_ORDER", order: { id, total: a.total, customer: a.customer.name, date: new Date().toLocaleDateString("fr-FR") } });
          await load();
          return id; // numéro de commande
        }
        default: return dispatch(a); // actions locales (panier, chargements)
      }
    } catch (e) {
      load(); // resynchronise avec la base en cas d'échec
      if (a.type === "PLACE_ORDER") throw e; // le checkout affiche lui-même l'erreur
      alert(e.message);
    }
  }, [state.products, state.cart, load]);

  const store = useMemo(() => ({ state, dispatch: act }), [state, act]);

  const go = (p, cat = "Tous") => { setShopCat(cat); setPage(p); window.scrollTo?.(0, 0); };
  const views = { home: <Home setPage={go} />, shop: <Shop key={shopCat} initialCat={shopCat} />, cart: <Cart setPage={go} />, checkout: <Checkout setPage={go} />, admin: <Admin /> };

  return (
    <StoreContext.Provider value={store}>
      <div className="min-h-screen w-full max-w-full overflow-x-clip bg-[#F5EEE3] text-[#2B2B2E]">
        <Header page={page} setPage={go} />
        <main>{views[page]}</main>
        <footer className="mt-10 bg-[#2B2B2E] py-10 text-center text-sm text-[#F5EEE3]/60">
          <button onClick={() => go("admin")} className="mb-3 inline-flex items-center gap-1 sm:hidden"><Lock size={12} /> Admin</button>
          <p>© DM All Services. Café de spécialité et matériel.</p>
        </footer>
      </div>
    </StoreContext.Provider>
  );
}


class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  render() {
    if (this.state.error) return <pre style={{ whiteSpace: "pre-wrap", margin: 16, padding: 12, background: "#fff3f0", color: "#7a1f10" }}>{"Erreur d'affichage : " + this.state.error.message}</pre>;
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
})();
