(function () {
  function show(msg) {
    var box = document.getElementById("diag") || document.createElement("pre");
    box.id = "diag";
    box.style.cssText = "white-space:pre-wrap;margin:16px;padding:12px;background:#fff3f0;color:#7a1f10;border:1px solid #e0b4a8;border-radius:8px;font:13px/1.4 monospace";
    box.textContent = (box.textContent ? box.textContent + "\n\n" : "Erreur : ") + msg;
    (document.body || document.documentElement).appendChild(box);
  }
  window.addEventListener("error", function (e) {
    if (e.target && e.target.src) show("Impossible de charger : " + e.target.src);
    else show((e.message || "erreur inconnue") + (e.lineno ? " (ligne " + e.lineno + ")" : ""));
  }, true);
  window.addEventListener("unhandledrejection", function (e) { show(String(e.reason && e.reason.message || e.reason)); });
  window.addEventListener("load", function () {
    var missing = ["React", "ReactDOM", "supabase", "Babel"].filter(function (n) { return !window[n]; });

})();

// Chaque fonction lève une erreur si Supabase en renvoie une (gérée par l'appelant).
const check = ({ data, error }) => { if (error) throw error; return data; };

const db = {
  products: async () => check(await supabase.from("products").select("*").order("id", { ascending: false })),
  addProduct: async (p) => check(await supabase.from("products").insert(p)),
  updateProduct: async (id, patch) => check(await supabase.from("products").update(patch).eq("id", id)),
  // Envoie une photo dans le stockage Supabase et retourne son adresse publique
  uploadImage: async (blob) => {
    const name = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
    const { error } = await supabase.storage.from("product-images").upload(name, blob, { contentType: "image/jpeg", cacheControl: "31536000" });
    if (error) throw error;
    return supabase.storage.from("product-images").getPublicUrl(name).data.publicUrl;
  },
  deleteProduct: async (id) => check(await supabase.from("products").delete().eq("id", id)),
  // Commandes : réservé à l'administrateur connecté (règle RLS)
  // Tarifs de livraison par commune (modifiables dans Supabase > Table Editor > delivery_zones)
  zones: async () => check(await supabase.from("delivery_zones").select("*").order("fee").order("commune")),
  orders: async () => {
    const rows = check(await supabase.from("orders").select("*").order("created_at", { ascending: false }));
    return rows.map((o) => ({ id: o.number, total: o.total, items: o.items, customer: o.customer.name, phone: o.customer.phone, address: o.customer.address, commune: o.customer.commune, expedition: o.customer.expedition, pay: o.customer.pay, date: new Date(o.created_at).toLocaleString("fr-FR"), status: o.status || "en_attente" }));
  },
  // Change le statut d'une commande : "en_attente", "livree" ou "annulee"
  setOrderStatus: async (number, status) => {
    const { data, error } = await supabase.from("orders").update({ status }).eq("number", number).select();
    if (error) throw new Error(/status/i.test(error.message) ? "Colonne « status » absente. Exécutez d'abord le code SQL des statuts dans Supabase." : error.message);
    if (!data || data.length === 0) throw new Error("Modification refusée par la base. Exécutez d'abord le code SQL des statuts dans Supabase.");
  },
  // Supprime une commande (administrateur). Supabase refuse en silence si la règle RLS manque : on le détecte.
  deleteOrder: async (number) => {
    const { data, error } = await supabase.from("orders").delete().eq("number", number).select();
    if (error) throw error;
    if (!data || data.length === 0) throw new Error("Suppression refusée par la base. Exécutez d'abord le code SQL de suppression des commandes dans Supabase.");
  },
  // Passe une commande : stock vérifié et décrémenté côté serveur. Retourne le numéro de commande.
  placeOrder: async (customer, cart) => check(await supabase.rpc("place_order", { p_customer: customer, p_items: cart })),
};

/* ==========================================================================
   2. ÉTAT GLOBAL (Context + Reducer)
   Boutique et administration partagent le même store : toute modification
   faite dans l'admin (stock, disponibilité, ajout, suppression) apparaît
   immédiatement côté boutique.
   ========================================================================== */

const StoreContext = createContext(null);
const useStore = () => useContext(StoreContext);

const initialState = { products: [], cart: [], orders: [] } // produits et commandes viennent de Supabase;

function reducer(state, action) {
  switch (action.type) {
    case "SET_PRODUCTS": // Catalogue reçu de la base
      return { ...state, products: action.products };
    case "SET_IMAGE": // Nouvelle photo d'un produit
      return { ...state, products: state.products.map((p) => (p.id === action.id ? { ...p, image: action.image } : p)) };
    case "SET_ORDERS": // Commandes reçues de la base (admin)
      return { ...state, orders: action.orders };
    case "SET_ORDER_STATUS": // Livrée / annulée / en attente
      return { ...state, orders: state.orders.map((o) => (o.id === action.id ? { ...o, status: action.status } : o)) };
    case "UPDATE_PRODUCT": // Modifie des champs d'un produit (tasses, intensité...)
      return { ...state, products: state.products.map((p) => (p.id === action.id ? { ...p, ...action.patch } : p)) };
    case "DELETE_ORDER": // Commande supprimée par l'administrateur
      return { ...state, orders: state.orders.filter((o) => o.id !== action.id) };
    case "DELETE_PRODUCT": // Supprime aussi le produit des paniers
      return { ...state, products: state.products.filter((p) => p.id !== action.id), cart: state.cart.filter((l) => l.id !== action.id) };
    case "TOGGLE_AVAILABLE":
      return { ...state, products: state.products.map((p) => (p.id === action.id ? { ...p, available: !p.available } : p)) };
    case "SET_STOCK": {
      const stock = Math.max(0, action.stock);
      return {
        ...state,
        products: state.products.map((p) => (p.id === action.id ? { ...p, stock } : p)),
        // Si le stock baisse sous la quantité d'un panier, on ajuste ce panier
        cart: state.cart.map((l) => (l.id === action.id ? { ...l, qty: Math.min(l.qty, stock) } : l)).filter((l) => l.qty > 0),
      };
    }
    case "CART_ADD": {
      const product = state.products.find((p) => p.id === action.id);
      const line = state.cart.find((l) => l.id === action.id);
      const qty = (line?.qty || 0) + (action.qty || 1);
      if (!product || qty > product.stock) return state; // jamais plus que le stock
      return { ...state, cart: line ? state.cart.map((l) => (l.id === action.id ? { ...l, qty } : l)) : [...state.cart, { id: action.id, qty }] };
    }
    case "CART_SET_QTY": {
      const product = state.products.find((p) => p.id === action.id);
      const qty = Math.min(action.qty, product?.stock ?? 0);
      return { ...state, cart: state.cart.map((l) => (l.id === action.id ? { ...l, qty } : l)).filter((l) => l.qty > 0) };
    }
    case "CART_REMOVE":
      return { ...state, cart: state.cart.filter((l) => l.id !== action.id) };
    case "PLACE_ORDER": {
      // Commande simulée : on décrémente le stock et on vide le panier
      const products = state.products.map((p) => {
        const line = state.cart.find((l) => l.id === p.id);
        return line ? { ...p, stock: Math.max(0, p.stock - line.qty) } : p;
      });
      return { ...state, products, cart: [], orders: [action.order, ...state.orders] };
    }
    default:
      return state;
  }
}

// Visuel produit : image si une URL est fournie, sinon pictogramme sur fond dégradé
function ProductVisual({ product, className = "" }) {
  const [broken, setBroken] = useState(false);
  const Icon = product.category === "Capsules" ? Package : product.category === "Accessoires" ? Wrench : Coffee;
  if (product.image && !broken) {
    return <img src={product.image} alt={product.name} loading="lazy" onError={() => setBroken(true)} className={`bg-white object-contain p-0.5 ${className}`} />; // photo entière dans le cadre, sans rognage
  }
  return (
    <div className={`flex items-center justify-center bg-gradient-to-br from-[#F6EFE4] to-[#E6D8C3] ${className}`} aria-label={product.name}>
      <Icon size={44} strokeWidth={1.25} color={C.espresso} />
    </div>
  );
}

// Fiche produit en grand : grande photo, description complète en gros caractères, quantité dans le panier
function ProductModal({ product, onClose, inCart, soldOut, maxed, dispatch }) {
  const closeRef = React.useRef(null);
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden"; // la page derrière ne défile plus
    closeRef.current && closeRef.current.focus();
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = prev; };
  }, []);
  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/70 sm:items-center sm:p-6" onClick={onClose}>
      <div role="dialog" aria-modal="true" aria-label={product.name} onClick={(e) => e.stopPropagation()} className="relative max-h-[92vh] w-full max-w-xl overflow-y-auto rounded-t-3xl bg-[#FBF7F0] sm:rounded-3xl">
        <button ref={closeRef} onClick={onClose} aria-label="Fermer" className="sticky top-3 float-right z-10 mr-3 mt-3 rounded-full bg-white p-2.5 text-[#2B1B14] shadow ring-1 ring-black/10"><X size={22} /></button>
        <ProductVisual product={product} className="h-72 w-full sm:h-96" />
        <div className="p-6">
          <p className="text-sm text-[#8A6A1E]">{product.category}</p>
          <h2 className="mt-1 font-serif text-3xl leading-tight text-[#2B1B14]">{product.name}</h2>
          {(product.cups > 0 || product.intensity > 0) && (
            <p className="mt-3 flex items-center gap-2 text-lg text-[#4A2E22]">
              <Coffee size={20} color={C.caramel} />
              {product.cups > 0 && <span>Tasses {product.cups}</span>}
              {product.cups > 0 && product.intensity > 0 && <span className="text-[#4A2E22]/30">|</span>}
              {product.intensity > 0 && <span>Intensité {product.intensity}</span>}
            </p>
          )}
          <p className="mt-4 whitespace-pre-line text-lg leading-relaxed text-[#4A2E22]">{product.description}</p>
          <p className="mt-5 font-serif text-3xl text-[#2B1B14]">{fmt(product.price)}</p>
          <p className="mt-1 text-sm text-[#4A2E22]/70">{soldOut ? "Rupture de stock" : product.stock <= 5 ? `Plus que ${product.stock} en stock` : "En stock"}</p>
          <div className="mt-5 flex flex-wrap items-center gap-3">
            {soldOut ? (
              <span className="text-base text-[#4A2E22]/60">Indisponible</span>
            ) : (
              <div className="flex items-center rounded-full ring-1 ring-[#2B1B14]/25">
                <button aria-label="Retirer un du panier" disabled={inCart <= 0} onClick={() => dispatch({ type: "CART_SET_QTY", id: product.id, qty: inCart - 1 })} className="p-3 disabled:opacity-30"><Minus size={20} /></button>
                <span className="min-w-[2.5rem] text-center text-lg tabular-nums text-[#2B1B14]" aria-live="polite">{inCart}</span>
                <button aria-label="Ajouter un au panier" disabled={maxed} onClick={() => dispatch({ type: "CART_ADD", id: product.id })} className="m-1 rounded-full bg-[#C8A45D] p-3 text-[#2B1B14] transition hover:bg-[#B8934A] disabled:opacity-30"><Plus size={20} /></button>
              </div>
            )}
            {maxed && !soldOut && <span className="text-sm text-[#8A6A1E]">Stock atteint</span>}
            <button onClick={onClose} className="rounded-full px-5 py-3 text-base text-[#2B1B14] ring-1 ring-[#2B1B14]/25">{inCart > 0 ? "Continuer mes achats" : "Fermer"}</button>
          </div>
        </div>
      </div>
    </div>,
    document.body
  );
}

function ProductCard({ product }) {
  const { dispatch, state } = useStore();
  const [open, setOpen] = useState(false); // fiche produit ouverte
  const inCart = state.cart.find((l) => l.id === product.id)?.qty || 0; // le + et le − agissent directement sur le panier
  const soldOut = product.stock === 0;
  const maxed = inCart >= product.stock; // plus rien à ajouter
  return (
    <article className="group flex min-w-0 max-w-full flex-row overflow-hidden rounded-2xl bg-[#F6EFE4] ring-1 ring-[#2B1B14]/10">
      <div className="relative flex w-40 shrink-0 cursor-zoom-in items-center justify-center bg-white sm:w-56" role="button" tabIndex={0} aria-label={`Voir ${product.name} en grand`} onClick={() => setOpen(true)} onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setOpen(true); } }}>
        <ProductVisual product={product} className="aspect-square w-full" />
        {soldOut && <span className="absolute left-2 top-2 rounded-full bg-[#2B1B14] px-2 py-0.5 text-[10px] text-white">Rupture de stock</span>}
        {!soldOut && product.stock <= 5 && <span className="absolute left-2 top-2 rounded-full bg-[#C8A45D] px-2 py-0.5 text-[10px] text-[#2B1B14]">Plus que {product.stock}</span>}

      <div className="flex min-w-0 flex-1 flex-col p-4">
        <p className="text-xs text-[#8A6A1E]">{product.category}</p>
        <h3 className="mt-1 font-serif text-base text-[#2B1B14] sm:text-lg"><button onClick={() => setOpen(true)} className="text-left hover:underline">{product.name}</button></h3>
        {(product.cups > 0 || product.intensity > 0) && (
          <p className="mt-1 flex items-center gap-1.5 text-sm text-[#4A2E22]/80">
            <Coffee size={14} color={C.caramel} />
            {product.cups > 0 && <span>Tasses {product.cups}</span>}
            {product.cups > 0 && product.intensity > 0 && <span className="text-[#4A2E22]/30">|</span>}
            {product.intensity > 0 && <span>Intensité {product.intensity}</span>}
          </p>
        )}
        <p className="mt-1 line-clamp-2 text-sm leading-relaxed text-[#4A2E22]/70">{product.description}</p>
        <button onClick={() => setOpen(true)} className="mt-1 flex-1 self-start text-left text-xs text-[#8A6A1E] underline">Voir les détails</button>
        <div className="mt-3">
          <span className="font-serif text-lg text-[#2B1B14]">{fmt(product.price)}</span>
          {inCart > 0 && <span className="ml-2 text-xs text-[#8A6A1E]">{inCart} au panier</span>}
        </div>
        <div className="mt-2 flex flex-wrap items-center gap-2">
          {soldOut ? (
            <span className="text-sm text-[#4A2E22]/60">Indisponible</span>
          ) : (
            <div className="flex items-center rounded-full ring-1 ring-[#2B1B14]/25">
              <button aria-label="Retirer un du panier" disabled={inCart <= 0} onClick={() => dispatch({ type: "CART_SET_QTY", id: product.id, qty: inCart - 1 })} className="p-2.5 disabled:opacity-30"><Minus size={16} /></button>
              <span className="min-w-[2rem] text-center text-sm tabular-nums text-[#2B1B14]" aria-live="polite">{inCart}</span>
              <button aria-label="Ajouter un au panier" disabled={maxed} onClick={() => dispatch({ type: "CART_ADD", id: product.id })} className="m-0.5 rounded-full bg-[#C8A45D] p-2 text-[#2B1B14] transition hover:bg-[#B8934A] disabled:opacity-30"><Plus size={16} /></button>

      </div>

// Lien WhatsApp vers un numéro de la boutique, avec la commande déjà rédigée
const orderWaLink = (n, d) => {
  const message = `Bonjour DM All Services, je viens de passer la commande ${d.id}.\n${d.items}\nTotal : ${fmt(d.total)}\nNom : ${d.name}\nAdresse : ${d.address}\n${d.interior ? "Ville (expédition)" : "Commune"} : ${d.commune}\n${d.interior ? "Expédition : frais à confirmer" : `Livraison : ${d.shipping === 0 ? "offerte" : fmt(d.shipping)}`}\nPaiement : ${d.pay}`;
  return `https://wa.me/${n}?text=${encodeURIComponent(message)}`;
};

function Checkout({ setPage }) {
  const { state, dispatch } = useStore();
  const [form, setForm] = useState({ name: "", address: "", commune: "", phone: "", pay: "Orange Money" });
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [done, setDone] = useState(null); // numéro de commande une fois validée
  const [zones, setZones] = useState(DEFAULT_ZONES); // communes desservies et leurs frais
  useEffect(() => { db.zones().then((rows) => { if (rows && rows.length) setZones(rows); }).catch(() => {}); }, []);
  const lines = state.cart.map((l) => ({ ...l, product: state.products.find((p) => p.id === l.id) })).filter((l) => l.product);
  const subtotal = lines.reduce((s, l) => s + l.qty * l.product.price, 0);
  const zone = zones.find((z) => z.commune === form.commune);
  const interior = !!(zone && zone.interior); // ville de l'intérieur : expédition, frais à confirmer par WhatsApp
  const free = !interior && subtotal >= FREE_SHIPPING_FROM;
  const shipping = free || interior ? 0 : zone ? zone.fee : 0; // frais connus une fois la commune choisie
  // Pas de paiement à la livraison pour une expédition : le colis est payé avant l'envoi
  const payOptions = Object.keys(PAYMENT_NUMBERS).filter((m) => !(interior && m === PAY_ON_DELIVERY));
  const total = subtotal + shipping;
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

  if (done) {
    const waLink = (n) => orderWaLink(n, done);
    return (
      <section className="mx-auto max-w-xl px-5 py-24 text-center">
        <div className="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-[#C8A45D]"><Check color="#F6EFE4" /></div>
        <h1 className="mt-6 font-serif text-3xl text-[#2B1B14]">Merci, votre commande est confirmée</h1>
        <p className="mt-3 text-[#4A2E22]/70">Commande n° {done.id}. {done.interior
            ? `Les frais d'expédition vers ${done.commune} vous seront communiqués sur WhatsApp. Vous payez ensuite le total par ${done.pay}, avant l'envoi du colis.`
            : done.pay === PAY_ON_DELIVERY
            ? `Vous paierez ${fmt(done.total)} à la livraison. Nous vous contactons pour confirmer l'heure et le lieu.`
            : PAYMENT_NUMBERS[done.pay]
            ? `Envoyez ${fmt(done.total)} par ${done.pay} au ${PAYMENT_NUMBERS[done.pay]}. Nous vous contactons ensuite pour confirmer la livraison.`
            : `Nous vous contactons au numéro indiqué pour finaliser le paiement par ${done.pay} et la livraison.`}</p>
        <div className="mt-8 flex flex-col items-center gap-3">
          <p className="text-sm text-[#4A2E22]/70">WhatsApp s'ouvre pour envoyer votre commande. S'il ne s'est pas ouvert, touchez un bouton :</p>
          {WHATSAPP_NUMBERS.map((n) => (
            <a key={n} href={waLink(n)} target="_blank" rel="noopener noreferrer" className="rounded-full bg-[#25D366] px-6 py-3 text-sm text-white">WhatsApp {fmtPhone(n)}</a>
          ))}
          <button onClick={() => setPage("shop")} className="rounded-full px-6 py-3 text-sm text-[#2B1B14] ring-1 ring-[#2B1B14]/20">Continuer mes achats</button>
        </div>
      </section>
    );
  }
  if (lines.length === 0 && !busy) return <Cart setPage={setPage} />;

  const submit = async (e) => {
    e.preventDefault();
    setBusy(true);
    setError("");
    // Onglet ouvert tout de suite au clic : sinon le navigateur bloque l'ouverture automatique de WhatsApp
    const waWin = window.open("", "_blank");
    try {
      // Le stock est vérifié et décrémenté côté serveur ; le total est recalculé en base
      const id = await dispatch({ type: "PLACE_ORDER", customer: form, total });
      const info = { id, pay: form.pay, total, name: form.name, address: form.address, commune: form.commune, shipping, interior, items: lines.map((l) => `${l.qty} × ${l.product.name}`).join(", ") };
      setDone(info);
      const link = orderWaLink(WHATSAPP_NUMBERS[0], info); // premier numéro par défaut
      if (waWin) waWin.location.href = link;
      else window.location.href = link;
    } catch (err) {
      if (waWin) waWin.close();
      setError(err.message);
    } finally {
      setBusy(false);
    }
  };
  const field = "mt-1 w-full rounded-lg border border-[#2B1B14]/20 bg-[#F6EFE4] text-[#2B1B14] placeholder:text-[#2B1B14]/40 px-3 py-2.5 text-sm focus:border-[#B98B5E] focus:outline-none focus:ring-1 focus:ring-[#B98B5E]";
  return (
    <section className="mx-auto max-w-3xl px-5 py-14">
      <button onClick={() => setPage("cart")} className="mb-6 flex items-center gap-1 text-sm text-[#8A6A1E]"><ArrowLeft size={14} /> Retour au panier</button>
      <h1 className="font-serif text-3xl text-[#2B1B14]">Finaliser la commande</h1>
      <form onSubmit={submit} className="mt-8 space-y-5">
        <label className="block text-sm">Nom complet<input required className={field} value={form.name} onChange={set("name")} /></label>
        <label className="block text-sm">{interior ? "Adresse, ou gare / agence de retrait" : "Quartier / adresse de livraison"}<input required className={field} value={form.address} onChange={set("address")} /></label>
        <label className="block text-sm">Commune ou ville
          <select required className={field} value={form.commune} onChange={(e) => {
            const z = zones.find((x) => x.commune === e.target.value);
            setForm({ ...form, commune: e.target.value, pay: z && z.interior && form.pay === PAY_ON_DELIVERY ? "Orange Money" : form.pay });
          }}>
            <option value="">Choisir votre commune ou votre ville</option>
            <optgroup label="Abidjan">
              {zones.filter((z) => !z.interior).map((z) => <option key={z.commune} value={z.commune}>{z.commune}{free ? "" : ` (${fmt(z.fee)})`}</option>)}
            </optgroup>
            {zones.some((z) => z.interior) && (
              <optgroup label="Expédition vers l'intérieur (frais à confirmer)">
                {zones.filter((z) => z.interior).map((z) => <option key={z.commune} value={z.commune}>{z.commune}</option>)}
              </optgroup>
            )}
          </select>
        </label>
        <label className="block text-sm">Téléphone (WhatsApp de préférence)<input required type="tel" className={field} value={form.phone} onChange={set("phone")} /></label>
        <label className="block text-sm">Mode de paiement
          <select className={field} value={form.pay} onChange={set("pay")}>
            {payOptions.map((m) => <option key={m}>{m}</option>)}
          </select>
        </label>
        <dl className="space-y-1 rounded-xl bg-[#F6EFE4] p-4 text-sm">
          <div className="flex justify-between"><dt>Sous-total</dt><dd>{fmt(subtotal)}</dd></div>
          <div className="flex justify-between"><dt>Livraison</dt><dd>{interior ? "À confirmer par WhatsApp" : free ? "Offerte" : zone ? fmt(shipping) : "Choisissez votre commune"}</dd></div>
          <div className="flex justify-between border-t border-[#2B1B14]/10 pt-2 font-serif text-base"><dt>Total</dt><dd>{fmt(total)}</dd></div>
        </dl>
        {interior && <p className="text-xs text-[#4A2E22]/70">Ce total ne comprend pas l'expédition. Nous vous annonçons son prix sur WhatsApp selon votre colis, puis vous payez le tout avant l'envoi.</p>}
        {error && <p role="alert" className="text-sm text-red-700">{error}</p>}
        <button disabled={busy} className="w-full rounded-full bg-[#C8A45D] py-3 text-sm text-[#2B1B14] hover:bg-[#B8934A] disabled:opacity-50">{busy ? "Validation…" : `Confirmer la commande, ${fmt(total)}${interior ? " + expédition" : ""}`}</button>
      </form>
    </section>
  );
}

// Réduit une photo (1000 px max, JPEG) avant l'envoi : rapide même avec une connexion mobile
const resizeImage = (file, max = 1000) => new Promise((resolve, reject) => {
  const img = new Image();
  img.onload = () => {
    const scale = Math.min(1, max / Math.max(img.width, img.height));
    const w = Math.round(img.width * scale);
    const h = Math.round(img.height * scale);
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#FFFFFF"; // fond blanc (évite un fond noir avec les images transparentes)
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(img.src);

    // Repère le produit : tout ce qui diffère de la couleur de marge (valeur médiane du bord de l'image)
    const { data } = ctx.getImageData(0, 0, w, h);
    const median = (arr) => arr.sort((p, q) => p - q)[Math.floor(arr.length / 2)];
    const edge = [];
    for (let x = 0; x < w; x++) { edge.push((x) * 4, ((h - 1) * w + x) * 4); }
    for (let y = 0; y < h; y++) { edge.push((y * w) * 4, (y * w + w - 1) * 4); }
    const bg = [0, 1, 2].map((c) => median(edge.map((i) => data[i + c])));
    const rows = new Array(h).fill(0);
    const cols = new Array(w).fill(0);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        if (Math.abs(data[i] - bg[0]) + Math.abs(data[i + 1] - bg[1]) + Math.abs(data[i + 2] - bg[2]) > 60) { rows[y]++; cols[x]++; }
      }
    }
    // Une ligne ou colonne compte seulement si elle contient assez de pixels (ignore les points isolés)
    const needR = Math.max(3, Math.round(w * 0.01));
    const needC = Math.max(3, Math.round(h * 0.01));
    const minY = rows.findIndex((n) => n >= needR);
    const maxY = h - 1 - [...rows].reverse().findIndex((n) => n >= needR);
    const minX = cols.findIndex((n) => n >= needC);
    const maxX = w - 1 - [...cols].reverse().findIndex((n) => n >= needC);

    // Recadre autour du produit avec une petite marge, seulement si les marges d'origine sont grandes
    let sx = 0, sy = 0, sw = w, sh = h;
    if (minX >= 0 && minY >= 0 && maxX > minX && maxY > minY) {
      const pad = Math.round(Math.max(maxX - minX, maxY - minY) * 0.04);
      const cx = Math.max(0, minX - pad);
      const cy = Math.max(0, minY - pad);
      const cw = Math.min(w, maxX + pad + 1) - cx;
      const ch = Math.min(h, maxY + pad + 1) - cy;
      if (cw >= 60 && ch >= 60 && cw * ch < w * h * 0.92) { sx = cx; sy = cy; sw = cw; sh = ch; }
    }
    const out = document.createElement("canvas");
    out.width = sw;
    out.height = sh;
    const octx = out.getContext("2d");
    octx.fillStyle = "#FFFFFF";
    octx.fillRect(0, 0, sw, sh);
    octx.drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
    out.toBlob((blob) => (blob ? resolve(blob) : reject(new Error("Photo illisible"))), "image/jpeg", 0.85);
  };
  img.onerror = () => reject(new Error("Photo illisible"));
  img.src = URL.createObjectURL(file);
});
const uploadPhoto = async (file) => db.uploadImage(await resizeImage(file));

// Formulaire d'ajout d'un produit
function ProductForm({ onClose }) {
  const { dispatch } = useStore();
  const [f, setF] = useState({ name: "", description: "", price: "", image: "", category: CATEGORIES[0], stock: 10, cups: "", intensity: "" });
  const [uploading, setUploading] = useState(false);
  // Envoie la photo choisie (galerie ou appareil photo) et garde son adresse pour l'enregistrement du produit
  const pickPhoto = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setUploading(true);
    try {
      const image = await uploadPhoto(file);
      setF((prev) => ({ ...prev, image }));
    } catch (err) {
      alert("Envoi de la photo impossible : " + err.message);
    } finally {
      setUploading(false);
    }
  };
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const submit = (e) => {
    e.preventDefault();
    const { cups, intensity, ...base } = f;
    const extra = {};
    if (parseInt(cups, 10) > 0) extra.cups = parseInt(cups, 10);
    if (parseInt(intensity, 10) > 0) extra.intensity = parseInt(intensity, 10);
    dispatch({ type: "ADD_PRODUCT", product: { ...base, ...extra, price: parseFloat(f.price), stock: parseInt(f.stock, 10) || 0, available: true, featured: false } });
    onClose();
  };
  const field = "mt-1 w-full rounded-lg border border-[#2B1B14]/20 bg-[#F6EFE4] text-[#2B1B14] placeholder:text-[#2B1B14]/40 px-3 py-2 text-sm focus:border-[#B98B5E] focus:outline-none";
  return (
    <form onSubmit={submit} className="mb-8 grid gap-4 rounded-2xl bg-[#F6EFE4] p-6 ring-1 ring-[#2B1B14]/10 sm:grid-cols-2">
      <div className="flex items-center justify-between sm:col-span-2">
        <h2 className="font-serif text-xl text-[#2B1B14]">Nouveau produit</h2>
        <button type="button" onClick={onClose} aria-label="Fermer"><X size={18} /></button>

      </label>
      <label className="text-sm sm:col-span-2">Description<textarea required rows={2} className={field} value={f.description} onChange={set("description")} /></label>
      <label className="text-sm">Prix (FCFA)<input required type="number" min="0" step="50" className={field} value={f.price} onChange={set("price")} /></label>
      <label className="text-sm">Stock initial<input required type="number" min="0" className={field} value={f.stock} onChange={set("stock")} /></label>
      <label className="text-sm">Nombre de tasses (facultatif)<input type="number" min="0" placeholder="ex. 50" className={field} value={f.cups} onChange={set("cups")} /></label>
      <label className="text-sm">Intensité (facultatif)<input type="number" min="0" max="13" placeholder="ex. 11" className={field} value={f.intensity} onChange={set("intensity")} /></label>
      <label className="text-sm sm:col-span-2">Photo du produit (facultatif)
        <input type="file" accept="image/*" className={field} onChange={pickPhoto} />
        {uploading && <span className="mt-1 block text-xs text-[#8A6A1E]">Envoi de la photo…</span>}
        {f.image && !uploading && <img src={f.image} alt="Aperçu" className="mt-2 h-24 w-24 rounded-lg object-cover" />}

      <button disabled={uploading} className="rounded-full bg-[#C8A45D] py-2.5 text-sm text-[#2B1B14] disabled:opacity-50 sm:col-span-2">Ajouter le produit</button>

  const [session, setSession] = useState(undefined); // undefined = vérification en cours
  const [adding, setAdding] = useState(false);
  const [orderFilter, setOrderFilter] = useState("all"); // filtre des commandes
  // Change la photo d'un produit existant
  const changePhoto = async (p, file) => {
    if (!file) return;
    try {
      const image = await uploadPhoto(file);
      dispatch({ type: "SET_IMAGE", id: p.id, image });
    } catch (err) {
      alert("Envoi de la photo impossible : " + err.message);
    }
  };

  // Suit la session de l'administrateur
  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session));
    const { data } = supabase.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => data.subscription.unsubscribe();
  }, []);

  // Une fois connecté, charge les commandes
  useEffect(() => {
    if (session) db.orders().then((orders) => dispatch({ type: "SET_ORDERS", orders })).catch(console.error);
  }, [session]);

  if (session === undefined) return null;
  if (!session) return <AdminLogin />;

  // Remet en stock les produits d'une commande annulée ou supprimée
  const restockItems = async (o) => {
    for (const i of o.items || []) {
      const p = state.products.find((x) => (i.id != null && x.id === i.id) || x.name === i.name);
      if (p) await dispatch({ type: "SET_STOCK", id: p.id, stock: p.stock + i.qty });
    }
  };
  const askRestock = () => window.confirm("Remettre les produits de cette commande en stock ?\n\nOK = oui, remettre en stock\nAnnuler = non, laisser le stock tel quel");
  // Marque une commande livrée, annulée ou de nouveau en attente
  const setStatus = async (o, status) => {
    if (status === "annulee") {
      if (!window.confirm(`Annuler la commande ${o.id} de ${o.customer} ?`)) return;
      const restock = askRestock();
      const ok = await dispatch({ type: "SET_ORDER_STATUS", id: o.id, status });
      if (ok && restock) await restockItems(o);
      return;
    }
    await dispatch({ type: "SET_ORDER_STATUS", id: o.id, status });
  };
  // Supprime définitivement une commande
  const removeOrder = async (o) => {
    if (!window.confirm(`Supprimer définitivement la commande ${o.id} de ${o.customer} ?`)) return;
    const restock = o.status === "annulee" ? false : askRestock();
    const ok = await dispatch({ type: "DELETE_ORDER", id: o.id });
    if (ok && restock) await restockItems(o);
  };
  const revenue = state.orders.filter((o) => o.status !== "annulee").reduce((s, o) => s + o.total, 0);
  const stats = [
    { label: "Produits", value: state.products.length },
    { label: "En rupture", value: state.products.filter((p) => p.stock === 0).length },
    { label: "Commandes", value: state.orders.length },
    { label: "Chiffre d'affaires", value: fmt(revenue) },
  ];
  return (
    <section className="mx-auto max-w-6xl px-5 py-12">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <h1 className="flex items-center gap-2 font-serif text-3xl text-[#2B1B14]"><LayoutDashboard size={26} color={C.caramel} /> Tableau de bord</h1>
        <div className="flex flex-wrap gap-2">
          <button onClick={() => supabase.auth.signOut()} className="rounded-full px-4 py-2.5 text-sm ring-1 ring-[#2B1B14]/20">Se déconnecter</button>
          <button onClick={() => setAdding(true)} className="flex items-center gap-2 rounded-full bg-[#C8A45D] px-5 py-2.5 text-sm text-[#2B1B14]"><Plus size={16} /> Ajouter un produit</button>
        </div>
      </div>

      <div className="mt-6 grid grid-cols-2 gap-4 md:grid-cols-4">
        {stats.map((s) => (
          <div key={s.label} className="rounded-xl bg-[#F6EFE4] p-4 ring-1 ring-[#2B1B14]/10">
            <p className="text-xs text-[#4A2E22]/60">{s.label}</p>
            <p className="mt-1 font-serif text-2xl text-[#2B1B14]">{s.value}</p>
          </div>
        ))}
      </div>

      <div className="mt-8">{adding && <ProductForm onClose={() => setAdding(false)} />}</div>

      {/* Mobile : une carte par produit (aucun défilement latéral) */}
      <ul className="space-y-3 md:hidden">
        {state.products.map((p) => (
          <li key={p.id} className="rounded-2xl bg-[#F6EFE4] text-[#2B1B14] placeholder:text-[#2B1B14]/40 p-4 ring-1 ring-[#2B1B14]/10">
            <div className="flex items-center gap-3">
              <label className="relative shrink-0 cursor-pointer" title="Changer la photo">
                <ProductVisual product={p} className="h-12 w-12 rounded-lg" />
                <span className="absolute -bottom-1 -right-1 rounded-full bg-[#C8A45D] p-1 text-[#2B1B14]"><Camera size={12} /></span>
                <input type="file" accept="image/*" className="hidden" onChange={(e) => changePhoto(p, e.target.files && e.target.files[0])} />
              </label>
              <div className="min-w-0 flex-1">
                <p className="truncate text-[#2B1B14]">{p.name}</p>
                <p className="text-xs text-[#4A2E22]/60">{p.category} · {fmt(p.price)}</p>
              </div>
              <button aria-label={`Supprimer ${p.name}`} onClick={() => window.confirm(`Supprimer « ${p.name} » ?`) && dispatch({ type: "DELETE_PRODUCT", id: p.id })} className="p-2 text-[#4A2E22]/50 hover:text-red-700"><Trash2 size={18} /></button>
            </div>

            <div className="mt-3 grid grid-cols-2 gap-2 text-xs text-[#4A2E22]/70">
              <label>Tasses<input key={`${p.id}-c-${p.cups}`} type="number" min="0" defaultValue={p.cups ?? ""} placeholder="—" onBlur={(e) => { const v = parseInt(e.target.value, 10) || null; if (v !== (p.cups ?? null)) dispatch({ type: "UPDATE_PRODUCT", id: p.id, patch: { cups: v } }); }} className="mt-1 w-full rounded border border-[#2B1B14]/20 px-2 py-1 text-sm text-[#2B1B14]" /></label>
              <label>Intensité<input key={`${p.id}-i-${p.intensity}`} type="number" min="0" max="13" defaultValue={p.intensity ?? ""} placeholder="—" onBlur={(e) => { const v = parseInt(e.target.value, 10) || null; if (v !== (p.intensity ?? null)) dispatch({ type: "UPDATE_PRODUCT", id: p.id, patch: { intensity: v } }); }} className="mt-1 w-full rounded border border-[#2B1B14]/20 px-2 py-1 text-sm text-[#2B1B14]" /></label>
            </div>
            <div className="mt-3 flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-1">
                <button aria-label="Diminuer le stock" onClick={() => dispatch({ type: "SET_STOCK", id: p.id, stock: p.stock - 1 })} className="rounded p-1.5 ring-1 ring-[#2B1B14]/20"><Minus size={14} /></button>
                <input aria-label={`Stock ${p.name}`} type="number" min="0" value={p.stock} onChange={(e) => dispatch({ type: "SET_STOCK", id: p.id, stock: parseInt(e.target.value, 10) || 0 })} className="w-16 rounded border border-[#2B1B14]/20 px-1 py-1 text-center" />
                <button aria-label="Augmenter le stock" onClick={() => dispatch({ type: "SET_STOCK", id: p.id, stock: p.stock + 1 })} className="rounded p-1.5 ring-1 ring-[#2B1B14]/20"><Plus size={14} /></button>
              </div>
              <button onClick={() => dispatch({ type: "TOGGLE_AVAILABLE", id: p.id })}
                className={`flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs ${p.available ? "bg-emerald-100 text-emerald-900" : "bg-black/5 text-[#4A2E22]"}`}>
                {p.available ? <Eye size={13} /> : <EyeOff size={13} />}{p.available ? "Disponible" : "Non disponible"}
              </button>
            </div>
          </li>
        ))}
      </ul>

      {/* Tablette et ordinateur : tableau complet */}
      <div className="hidden w-full max-w-full overflow-x-auto rounded-2xl ring-1 ring-[#2B1B14]/10 md:block">
        <table className="w-full min-w-[860px] text-left text-sm">
          <thead className="bg-[#F6EFE4] text-[#4A2E22]/60">
            <tr><th className="p-3 font-normal">Produit</th><th className="p-3 font-normal">Catégorie</th><th className="p-3 font-normal">Prix</th><th className="p-3 font-normal">Tasses / Intensité</th><th className="p-3 font-normal">Stock</th><th className="p-3 font-normal">Visibilité</th><th className="p-3" /></tr>
          </thead>
          <tbody className="divide-y divide-[#2B1B14]/10 bg-[#F6EFE4] text-[#2B1B14] placeholder:text-[#2B1B14]/40">
            {state.products.map((p) => (
              <tr key={p.id}>
                <td className="p-3">
                  <div className="flex items-center gap-3"><label className="relative shrink-0 cursor-pointer" title="Changer la photo">
                <ProductVisual product={p} className="h-10 w-10 rounded-lg" />
                <span className="absolute -bottom-1 -right-1 rounded-full bg-[#C8A45D] p-1 text-[#2B1B14]"><Camera size={12} /></span>
                <input type="file" accept="image/*" className="hidden" onChange={(e) => changePhoto(p, e.target.files && e.target.files[0])} />
              </label><span className="text-[#2B1B14]">{p.name}</span></div>
                </td>
                <td className="p-3 text-[#4A2E22]/70">{p.category}</td>
                <td className="p-3">{fmt(p.price)}</td>
                <td className="p-3">
                  <div className="flex items-center gap-1">
                    <input aria-label={`Tasses ${p.name}`} key={`${p.id}-c-${p.cups}`} type="number" min="0" defaultValue={p.cups ?? ""} placeholder="—" onBlur={(e) => { const v = parseInt(e.target.value, 10) || null; if (v !== (p.cups ?? null)) dispatch({ type: "UPDATE_PRODUCT", id: p.id, patch: { cups: v } }); }} className="w-14 rounded border border-[#2B1B14]/20 px-1 py-0.5 text-center" />
                    <input aria-label={`Intensité ${p.name}`} key={`${p.id}-i-${p.intensity}`} type="number" min="0" max="13" defaultValue={p.intensity ?? ""} placeholder="—" onBlur={(e) => { const v = parseInt(e.target.value, 10) || null; if (v !== (p.intensity ?? null)) dispatch({ type: "UPDATE_PRODUCT", id: p.id, patch: { intensity: v } }); }} className="w-14 rounded border border-[#2B1B14]/20 px-1 py-0.5 text-center" />
                  </div>
                </td>
                <td className="p-3">
                  <div className="flex items-center gap-1">
                    <button aria-label="Diminuer le stock" onClick={() => dispatch({ type: "SET_STOCK", id: p.id, stock: p.stock - 1 })} className="rounded p-1 ring-1 ring-[#2B1B14]/20"><Minus size={12} /></button>
                    <input aria-label={`Stock ${p.name}`} type="number" min="0" value={p.stock} onChange={(e) => dispatch({ type: "SET_STOCK", id: p.id, stock: parseInt(e.target.value, 10) || 0 })} className="w-14 rounded border border-[#2B1B14]/20 px-1 py-0.5 text-center" />
                    <button aria-label="Augmenter le stock" onClick={() => dispatch({ type: "SET_STOCK", id: p.id, stock: p.stock + 1 })} className="rounded p-1 ring-1 ring-[#2B1B14]/20"><Plus size={12} /></button>
                  </div>
                </td>
                <td className="p-3">
                  <button onClick={() => dispatch({ type: "TOGGLE_AVAILABLE", id: p.id })}
                    className={`flex items-center gap-1.5 rounded-full px-3 py-1 text-xs ${p.available ? "bg-emerald-100 text-emerald-900" : "bg-black/5 text-[#4A2E22]"}`}>
                    {p.available ? <Eye size={13} /> : <EyeOff size={13} />}{p.available ? "Disponible" : "Non disponible"}
                  </button>
                </td>
                <td className="p-3 text-right">
                  <button aria-label={`Supprimer ${p.name}`} onClick={() => window.confirm(`Supprimer « ${p.name} » ?`) && dispatch({ type: "DELETE_PRODUCT", id: p.id })} className="p-2 text-[#4A2E22]/50 hover:text-red-700"><Trash2 size={16} /></button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        {state.products.length === 0 && <p className="p-8 text-center text-[#4A2E22]/60">Aucun produit. Ajoutez votre premier café.</p>}
      </div>
      {/* Commandes reçues : de quoi contacter et livrer le client */}
      <h2 className="mb-3 mt-10 font-serif text-2xl text-[#2B1B14]">Commandes récentes</h2>
      {(() => {
        const STATUS = {
          en_attente: { label: "En attente", cls: "bg-[#C8A45D]/15 text-[#8A6A1E]" },
          livree: { label: "Livrée", cls: "bg-[#6FBF73]/15 text-[#2E7D4F]" },
          annulee: { label: "Annulée", cls: "bg-[#E0705F]/15 text-[#B3402F]" },
        };
        const filters = [["all", "Toutes"], ["en_attente", "En attente"], ["livree", "Livrées"], ["annulee", "Annulées"]];
        const count = (k) => (k === "all" ? state.orders.length : state.orders.filter((o) => o.status === k).length);
        const shown = state.orders.filter((o) => orderFilter === "all" || o.status === orderFilter);
        const btn = "rounded-full px-3 py-1.5 text-xs ring-1 ring-[#2B1B14]/20 hover:text-[#2B1B14]";
        return (
          <>
            <div className="mb-4 flex flex-wrap gap-2">
              {filters.map(([k, label]) => (
                <button key={k} onClick={() => setOrderFilter(k)} className={`rounded-full px-3 py-1.5 text-xs ${orderFilter === k ? "bg-[#C8A45D] text-[#2B1B14]" : "text-[#4A2E22]/70 ring-1 ring-[#2B1B14]/20"}`}>{label} ({count(k)})</button>
              ))}
            </div>
            {shown.length === 0 ? (
              <p className="text-sm text-[#4A2E22]/60">Aucune commande dans cette liste.</p>
            ) : (
              <ul className="space-y-3">
                {shown.map((o) => {
                  const st = STATUS[o.status] || STATUS.en_attente;
                  return (
                    <li key={o.id} className="rounded-2xl bg-[#F6EFE4] p-4 text-sm text-[#2B1B14] ring-1 ring-[#2B1B14]/10">
                      <div className="flex items-center justify-between gap-2"><span className="font-serif text-[#2B1B14]">{o.id}</span><span className={`rounded-full px-2.5 py-0.5 text-xs ${st.cls}`}>{st.label}</span></div>
                      <p className="mt-0.5 text-xs text-[#4A2E22]/60">{o.date}</p>
                      <p className="mt-2">{o.customer} · <a href={`tel:${o.phone}`} className="text-[#8A6A1E] underline">{o.phone}</a></p>
                      <p className="text-[#4A2E22]/70">{o.address}{o.commune ? ` · ${o.commune}` : ""}</p>
                      {o.expedition && <p className="mt-1 inline-block rounded-full bg-[#C8A45D]/25 px-2 py-0.5 text-xs text-[#8A6A1E]">Expédition : frais à confirmer</p>}
                      <p className="mt-1 text-[#4A2E22]/70">{(o.items || []).map((i) => `${i.qty} × ${i.name}`).join(", ")}</p>
                      <p className="mt-2 flex justify-between"><span>{o.pay}</span><span className="font-serif text-[#2B1B14]">{fmt(o.total)}</span></p>
                      <div className="mt-3 flex flex-wrap justify-end gap-2">
                        {o.status === "en_attente" && <button onClick={() => setStatus(o, "livree")} className="flex items-center gap-1.5 rounded-full bg-[#C8A45D] px-3 py-1.5 text-xs text-[#2B1B14] hover:bg-[#B8934A]"><Check size={14} /> Marquer livrée</button>}
                        {o.status === "en_attente" && <button onClick={() => setStatus(o, "annulee")} className={`${btn} text-[#4A2E22]/70`}>Annuler</button>}
                        {o.status === "livree" && <button onClick={() => setStatus(o, "en_attente")} className={`${btn} text-[#4A2E22]/70`}>Remettre en attente</button>}
                        <button onClick={() => removeOrder(o)} aria-label={`Supprimer la commande ${o.id}`} className={`${btn} flex items-center gap-1.5 text-[#4A2E22]/70`}><Trash2 size={14} /> Supprimer</button>
                      </div>
                    </li>
                  );
                })}
              </ul>
            )}
          </>
        );
      })()}
      <p className="mt-4 flex items-center gap-1 text-xs text-[#4A2E22]/50"><Store size={12} /> Les changements de stock et de visibilité sont répercutés instantanément dans la boutique.</p>
    </section>
  );
}

/* ==========================================================================
   8. APPLICATION (routage simple par état)
   ========================================================================== */

function App() {
  const [state, dispatch] = useReducer(reducer, initialState);
  const [page, setPage] = useState("home");
  const [shopCat, setShopCat] = useState("Tous"); // secteur présélectionné dans la boutique
  const [shopSub, setShopSub] = useState(""); // rubrique présélectionnée (sous-menu)

  // Charge le catalogue depuis la base
  const load = useCallback(async () => {
    try { dispatch({ type: "SET_PRODUCTS", products: await db.products() }); } catch (e) { console.error(e); }
  }, []);

  // Temps réel : tout changement en base (admin, commande d'un client) met la boutique à jour
  useEffect(() => {
    load();
    const channel = supabase.channel("products-live").on("postgres_changes", { event: "*", schema: "public", table: "products" }, load).subscribe();
    return () => { supabase.removeChannel(channel); };
  }, [load]);

  // Toute action de l'admin ou du checkout est écrite en base, puis répercutée à l'écran.
  // Le panier reste local (navigateur).
  const act = useCallback(async (a) => {
    try {
      switch (a.type) {
        case "ADD_PRODUCT": await db.addProduct(a.product); return load();
        case "DELETE_PRODUCT": dispatch(a); return await db.deleteProduct(a.id);
        case "UPDATE_PRODUCT": dispatch(a); return await db.updateProduct(a.id, a.patch);
        case "SET_ORDER_STATUS": await db.setOrderStatus(a.id, a.status); dispatch(a); return true;
        case "DELETE_ORDER": await db.deleteOrder(a.id); dispatch(a); return true; // true = supprimée
        case "TOGGLE_AVAILABLE": {
          dispatch(a);
          const p = state.products.find((x) => x.id === a.id);
          return await db.updateProduct(a.id, { available: !p.available });
        }
        case "SET_IMAGE": dispatch(a); return await db.updateProduct(a.id, { image: a.image });
        case "SET_STOCK": dispatch(a); return await db.updateProduct(a.id, { stock: Math.max(0, a.stock) });
        case "PLACE_ORDER": {
          const id = await db.placeOrder(a.customer, state.cart);
          dispatch({ type: "PLACE_ORDER", order: { id, total: a.total, customer: a.customer.name, date: new Date().toLocaleDateString("fr-FR") } });
          await load();
          return id; // numéro de commande
        }
        default: return dispatch(a); // actions locales (panier, chargements)
      }
    } catch (e) {
      load(); // resynchronise avec la base en cas d'échec
      if (a.type === "PLACE_ORDER") throw e; // le checkout affiche lui-même l'erreur
      alert(e.message);
    }
  }, [state.products, state.cart, load]);

  const store = useMemo(() => ({ state, dispatch: act }), [state, act]);

  const go = (p, cat = "Tous", sub = "") => { setShopCat(cat); setShopSub(sub); setPage(p); window.scrollTo?.(0, 0); };
  const views = { home: <Home setPage={go} />, shop: <Shop key={`${shopCat}-${shopSub}`} initialCat={shopCat} initialSub={shopSub} />, cart: <Cart setPage={go} />, checkout: <Checkout setPage={go} />, admin: <Admin /> };

  return (
    <StoreContext.Provider value={store}>
      <div className="min-h-screen w-full max-w-full overflow-x-clip bg-[#FBF7F0] text-[#4A2E22]">
        <Header page={page} setPage={go} shopCat={shopCat} />
        <main>{views[page]}</main>
        <a href={waChat("Bonjour DM All Services, j'ai une question.")} target="_blank" rel="noopener noreferrer" aria-label="Nous écrire sur WhatsApp" className="fixed bottom-5 right-4 z-30 flex items-center gap-2 rounded-full bg-[#25D366] px-4 py-3 text-sm font-medium text-white shadow-lg shadow-black/25 transition hover:bg-[#1FB859] focus:outline-none focus-visible:ring-2 focus-visible:ring-white"><MessageCircle size={22} /> WhatsApp</a>
        <footer className="mt-10 bg-[#2B1B14] pb-24 pt-10 text-center text-sm text-[#F6EFE4]/60">
          <button onClick={() => go("admin")} className="mb-3 inline-flex items-center gap-1 sm:hidden"><Lock size={12} /> Admin</button>
          <p>© DM All Services. Capsules, café et matériel.</p>
          <p className="mt-2">WhatsApp : {WHATSAPP_NUMBERS.map((n, i) => <a key={n} href={`https://wa.me/${n}`} target="_blank" rel="noopener noreferrer" className="underline">{i > 0 ? " · " : ""}{fmtPhone(n)}</a>)}</p>
        </footer>
      </div>
    </StoreContext.Provider>
  );
}


class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  render() {
    if (this.state.error) return <pre style={{ whiteSpace: "pre-wrap", margin: 16, padding: 12, background: "#fff3f0", color: "#7a1f10" }}>{"Erreur d'affichage : " + this.state.error.message}</pre>;
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
})();
</script>
